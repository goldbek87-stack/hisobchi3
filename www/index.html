<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Hisobchi</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1E9E64">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F4;
  --card:#FFFFFF;
  --primary:#1E9E64;
  --primary-dark:#167A4E;
  --text:#1F2937;
  --text-soft:#6B7280;
  --border:#E7EAEE;
  --danger:#DC2626;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  font-family:'Inter',system-ui,sans-serif;
  color:var(--text);
  min-height:100vh;
}
.app{
  max-width:460px;
  margin:0 auto;
  min-height:100vh;
  background:var(--bg);
  padding-bottom:88px;
  position:relative;
}
.tab-content{display:none;padding:16px;}
.tab-content.active{display:block;}

/* top bars */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 2px 10px;
}
.topbar h2{font-size:16px;font-weight:700;margin:0;letter-spacing:.01em;}
.topbar .icon-btn{
  background:none;border:none;font-size:18px;color:var(--text);cursor:pointer;
  width:34px;height:34px;display:flex;align-items:center;justify-content:center;
}
.date-input{
  border:none;background:none;font-family:'Inter';font-size:16px;color:var(--text);
}

/* cards */
.card{
  background:var(--card);
  border-radius:16px;
  padding:18px;
  margin-bottom:14px;
  box-shadow:0 1px 2px rgba(20,20,30,.04), 0 1px 8px rgba(20,20,30,.03);
}
.card-title{font-size:13px;color:var(--text-soft);margin:0 0 6px;}
.big-amount{font-size:28px;font-weight:700;color:var(--text);margin:0;}
.big-amount.red{color:#c94b3f;}

/* mic hero */
.mic-hero{text-align:center;padding:8px 0 4px;}
.mic-circle{
  width:76px;height:76px;border-radius:50%;
  background:var(--primary);
  border:none;color:#fff;font-size:30px;
  display:flex;align-items:center;justify-content:center;
  margin:10px auto;cursor:pointer;
  box-shadow:0 4px 14px rgba(30,158,100,.35);
}
.mic-circle.listening{animation:pulse 1.3s infinite;background:#c94b3f;box-shadow:0 4px 14px rgba(201,75,63,.4);}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(201,75,63,.45);}
  70%{box-shadow:0 0 0 16px rgba(201,75,63,0);}
  100%{box-shadow:0 0 0 0 rgba(201,75,63,0);}
}
.mic-hint{font-size:12.5px;color:var(--text-soft);}

/* category rows */
.cat-row{
  display:flex;align-items:center;gap:12px;padding:10px 0;
  border-bottom:1px solid var(--border);
}
.cat-row:last-child{border-bottom:none;}
.cat-icon{
  width:38px;height:38px;border-radius:11px;
  display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;
}
.cat-name{flex:1;font-size:14px;}
.cat-amt{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;}
.cat-pct{font-size:11.5px;color:var(--text-soft);width:34px;text-align:right;}

.link-row{
  text-align:center;color:var(--primary);font-size:13px;font-weight:600;
  padding:10px 0 2px;cursor:pointer;
}

/* month nav */
.month-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}
.month-nav button{background:none;border:none;font-size:18px;color:var(--text);cursor:pointer;padding:4px 10px;}
.month-nav .m-label{font-weight:700;font-size:15px;}

/* subtabs / pill tabs */
.pill-tabs{display:flex;gap:6px;margin-bottom:12px;background:#F1F3F6;padding:4px;border-radius:10px;}
.pill-tabs button{
  flex:1;padding:8px 6px;font-size:12.5px;border:none;background:none;border-radius:8px;cursor:pointer;color:var(--text-soft);font-weight:600;
}
.pill-tabs button.active{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08);}

/* entry list (day list) */
.entry-row{
  display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border);cursor:pointer;
}
.entry-row:last-child{border-bottom:none;}
.entry-time{font-size:11px;color:var(--text-soft);width:38px;flex-shrink:0;}
.entry-main{flex:1;min-width:0;}
.entry-note{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.entry-cat-name{font-size:11.5px;color:var(--text-soft);}
.entry-amt{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;}

/* back header */
.back-header{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.back-header .icon-btn{font-size:20px;}
.back-header h2{font-size:15px;font-weight:700;flex:1;}

/* categories grid */
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.cat-card{
  background:var(--card);border-radius:14px;padding:14px;display:flex;align-items:center;gap:10px;
  box-shadow:0 1px 2px rgba(20,20,30,.04);position:relative;cursor:pointer;
}
.cat-card .cat-icon{width:34px;height:34px;border-radius:10px;font-size:16px;}
.cat-card .name{font-size:13px;font-weight:500;}
.cat-card .menu-dot{position:absolute;top:8px;right:10px;font-size:14px;color:var(--text-soft);}

.btn{border:none;border-radius:10px;padding:12px 16px;font-size:14px;font-weight:600;cursor:pointer;width:100%;}
.btn-primary{background:var(--primary);color:#fff;}
.btn-ghost{background:#F1F3F6;color:var(--text);}
.btn-danger{background:#FDE8E8;color:var(--danger);}

/* forms */
.field{margin-bottom:12px;}
.field label{display:block;font-size:11.5px;color:var(--text-soft);text-transform:uppercase;letter-spacing:.03em;margin-bottom:5px;}
.field input, .field select, .field textarea{
  width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:9px;font-size:14px;font-family:'Inter';color:var(--text);background:#fff;
}
.two-col{display:flex;gap:10px;}
.two-col .field{flex:1;}
.swatch-row{display:flex;flex-wrap:wrap;gap:8px;}
.swatch{width:32px;height:32px;border-radius:9px;cursor:pointer;border:2px solid transparent;}
.swatch.active{border-color:var(--text);}

/* search */
.search-box{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--border);border-radius:10px;padding:9px 12px;margin-bottom:14px;}
.search-box input{border:none;outline:none;flex:1;font-size:14px;}
.chip-group{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px;}
.chip-btn{padding:7px 13px;border-radius:18px;border:1px solid var(--border);background:#fff;font-size:12.5px;cursor:pointer;color:var(--text);}
.chip-btn.active{background:var(--primary);color:#fff;border-color:var(--primary);}
.quick-chip{
  display:block;width:100%;text-align:left;background:#F1F9F5;border:1px solid #d3ecdf;color:var(--primary-dark);
  border-radius:9px;padding:10px 12px;font-size:13px;margin-bottom:8px;cursor:pointer;
}

/* bottom nav */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;
  max-width:460px;margin:0 auto;
  background:#fff;border-top:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-around;
  padding:8px 6px calc(8px + env(safe-area-inset-bottom));
  z-index:20;
}
.nav-btn{
  background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:2px;
  font-size:10.5px;color:var(--text-soft);cursor:pointer;padding:4px 8px;
}
.nav-btn .ico{font-size:19px;}
.nav-btn.active{color:var(--primary);font-weight:600;}
.nav-fab{
  width:52px;height:52px;border-radius:50%;background:var(--primary);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:22px;
  margin-top:-26px;box-shadow:0 3px 10px rgba(30,158,100,.4);border:3px solid #fff;cursor:pointer;
}

/* overlays / modals */
.overlay{
  position:fixed;inset:0;background:rgba(20,24,28,.45);display:none;
  align-items:flex-end;justify-content:center;z-index:50;
}
.overlay.show{display:flex;}
.sheet{
  background:var(--bg);width:100%;max-width:460px;border-radius:20px 20px 0 0;
  padding:18px 16px calc(18px + env(safe-area-inset-bottom));
  max-height:88vh;overflow-y:auto;
}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.sheet-head h3{font-size:16px;margin:0;}
.sheet-head .icon-btn{font-size:19px;}

.voice-item{
  background:#fff;border-radius:12px;padding:12px;margin-bottom:10px;border:1px solid var(--border);
}
.voice-item .row1{display:flex;gap:8px;margin-bottom:8px;}
.voice-item .row1 input:first-child{width:110px;flex-shrink:0;}
.voice-item select{font-size:12.5px;}
.voice-item .rm{background:none;border:none;color:var(--text-soft);font-size:16px;cursor:pointer;float:right;}

.transcript-box{
  font-size:13.5px;color:var(--text-soft);background:#F1F3F6;border-radius:10px;padding:10px 12px;min-height:20px;margin:10px 0;
}
.empty{text-align:center;color:var(--text-soft);font-size:13px;padding:26px 12px;}
</style>
</head>
<body>

  <!-- ============ HOME TAB ============ -->

<!-- EDIT EXPENSE OVERLAY -->
<div class="overlay" id="editOverlay">

      <h3>Xarajat tafsiloti</h3>
      <button class="icon-btn" data-action="close-overlay" data-overlay="editOverlay">✓</button>

<!-- CATEGORY EDIT OVERLAY -->

    <div style="margin-top:10px;" id="categoryDeleteWrap"></div>
  </div>

<input type="file" id="importFileInput" accept="application/json" style="display:none;">

<script>
/* ============================================================
   STORAGE ABSTRACTION
   window.storage only exists inside Claude.ai artifact preview.
   Once this app is hosted on its own (GitHub Pages / wrapped as
   an APK), it must rely on the browser's own localStorage.
   This wrapper tries localStorage first and silently falls back
   to an in-memory store if it's unavailable, so it never crashes.
   ============================================================ */
let memoryStore = {};
const DB = {
  get(key){
    try{ const v = localStorage.getItem(key); return v; }
    catch(e){ return memoryStore[key] ?? null; }
  },
  set(key, value){
    try{ localStorage.setItem(key, value); }
    catch(e){ memoryStore[key] = value; }
  }
};

// True when running inside the Capacitor native Android wrapper (the APK),
// false in a plain browser / PWA context. Several features (voice input,
// backup sharing) branch on this.
const isNativeApp = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());

/* ============================================================ DATA */
const DEFAULT_CATEGORIES = [
  {key:'rozgor', name:"Ro‘zg‘or", icon:'🧺', color:'#1E9E64', bg:'#E6F7EE', type:'expense'},
  {key:'yolkira', name:"Yo‘l-kira", icon:'🚗', color:'#2563EB', bg:'#E8F0FE', type:'expense'},
  {key:'kochadagi', name:"Ko‘chadagi xarajat", icon:'☕', color:'#F97316', bg:'#FFF1E6', type:'expense'},
  {key:'kiyim', name:"Kiyim-kechak", icon:'👕', color:'#9333EA', bg:'#F3E8FF', type:'expense'},
  {key:'sogliq', name:"Sog‘liq", icon:'❤️', color:'#DC2626', bg:'#FDE8E8', type:'expense'},
  {key:'oila', name:"Oila va bolalar", icon:'👨‍👩‍👧', color:'#0D9488', bg:'#E6FBF8', type:'expense'},
  {key:'uyjoy', name:"Uy-joy", icon:'🏠', color:'#16A34A', bg:'#E6F7EE', type:'expense'},
  {key:'aloqa', name:"Aloqa va internet", icon:'📶', color:'#2563EB', bg:'#E8F0FE', type:'expense'},
  {key:'ish', name:"Ish / biznes", icon:'💼', color:'#92400E', bg:'#F5EDE3', type:'expense'},
  {key:'sovga', name:"Sovg‘a", icon:'🎁', color:'#DB2777', bg:'#FCE7F3', type:'expense'},
  {key:'kongilochar', name:"Ko‘ngilochar", icon:'🎮', color:'#7C3AED', bg:'#F3E8FF', type:'expense'},
  {key:'kutilmagan', name:"Kutilmagan xarajat", icon:'⚠️', color:'#DC2626', bg:'#FEE2E2', type:'expense'},
  {key:'boshqa', name:"Boshqa", icon:'⋯', color:'#64748B', bg:'#F1F5F9', type:'expense'},
  {key:'maosh', name:"Maosh / ish haqi", icon:'💵', color:'#16A34A', bg:'#E6F7EE', type:'income'},
  {key:'qarz_kirim', name:"Qarz qaytishi", icon:'🤝', color:'#0EA5E9', bg:'#E0F2FE', type:'income'},
  {key:'savdo', name:"Savdo / biznes daromadi", icon:'📈', color:'#7C3AED', bg:'#F3E8FF', type:'income'},
  {key:'sovga_kirim', name:"Sovg‘a / hadya", icon:'🎁', color:'#DB2777', bg:'#FCE7F3', type:'income'},
  {key:'boshqa_kirim', name:"Boshqa daromad", icon:'⋯', color:'#64748B', bg:'#F1F5F9', type:'income'}
];
const SWATCHES = ['#1E9E64','#2563EB','#F97316','#9333EA','#DC2626','#0D9488','#16A34A','#92400E','#DB2777','#7C3AED','#64748B','#0EA5E9'];
const MONTH_NAMES = ['Yanvar','Fevral','Mart','Aprel','May','Iyun','Iyul','Avgust','Sentabr','Oktabr','Noyabr','Dekabr'];
const WEEKDAYS = ['Yak','Dush','Sesh','Chor','Pay','Jum','Shan'];

let expenses = [];
let categories = [...DEFAULT_CATEGORIES];
let currentTab = 'home';
let selectedDate = todayISO();
let homeShowingDayList = false;
let reportMonth = new Date().getMonth();
let reportYear = new Date().getFullYear();
let reportSubtab = 'categories';
let reportType = 'expense';
let showingAnalytics = false;
let analyticsTab = 'umumiy';
let editingExpenseId = null;
let editingCategoryKey = null;
let voiceItems = [];
let micLang = 'uz-UZ';

/* ============================================================ HELPERS */
function todayISO(){ const d = new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function pad(n){ return n<10 ? '0'+n : ''+n; }
function fmt(n){ return Math.round(n||0).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }
function uid(){ return 'x_'+Date.now()+'_'+Math.random().toString(36).slice(2,7); }
function catByKey(key){ return categories.find(c=>c.key===key) || categories.find(c=>c.key==='boshqa'); }
function catsOfType(type){ return categories.filter(c=>c.type===type); }
function dayTitle(iso){
  const d = new Date(iso+'T00:00:00');
  return d.getDate()+' '+MONTH_NAMES[d.getMonth()]+', '+WEEKDAYS[d.getDay()];
}
function loadAll(){
  try{ expenses = JSON.parse(DB.get('expenses') || '[]'); }catch(e){ expenses = []; }
  expenses.forEach(e=>{ if(!e.type) e.type='expense'; });
  try{ categories = JSON.parse(DB.get('categories') || JSON.stringify(DEFAULT_CATEGORIES)); }catch(e){ categories = [...DEFAULT_CATEGORIES]; }
  categories.forEach(c=>{ if(!c.type) c.type='expense'; });
  micLang = DB.get('micLang') || 'uz-UZ';
}
function persistExpenses(){ DB.set('expenses', JSON.stringify(expenses)); }
function persistCategories(){ DB.set('categories', JSON.stringify(categories)); }

function expensesForDate(iso){ return expenses.filter(e=>e.dateISO===iso); }
function expensesForMonth(y,m){ return expenses.filter(e=>{ const d=new Date(e.dateISO+'T00:00:00'); return d.getFullYear()===y && d.getMonth()===m; }); }
function sumOf(list){ return list.reduce((s,e)=>s+e.amount,0); }
function onlyExpense(list){ return list.filter(e=>e.type!=='income'); }
function onlyIncome(list){ return list.filter(e=>e.type==='income'); }
function balanceOf(list){ return sumOf(onlyIncome(list)) - sumOf(onlyExpense(list)); }

function categoryBreakdown(list){
  const map = {};
  list.forEach(e=>{ map[e.categoryKey] = (map[e.categoryKey]||0) + e.amount; });
  const total = sumOf(list) || 1;
  return Object.entries(map).map(([key,amt])=>({ cat: catByKey(key), amount: amt, pct: Math.round(amt/total*100) }))
    .sort((a,b)=>b.amount-a.amount);
}

/* ============================================================ CATEGORY GUESS + PARSING */
const KEYWORD_MAP = {
  rozgor: ['non','sut','go‘sht','gosht','sabzavot','meva','bozor','market','un ','yog‘','tuz','guruch','do‘kon','dokon','mahsulot'],
  yolkira: ['taksi','taxi','avtobus','metro','benzin','yoqilg‘i','yoqilgi','yandex','yo‘l','yol'],
  kochadagi: ['tushlik','nonushta','kechki ovqat','kafe','restoran','choyxona','fastfud'],
  kiyim: ['kiyim','oyoq kiyim','ko‘ylak','koylak','shim','krossovka'],
  sogliq: ['dori','shifokor','vrach','klinika','dorixona','tish'],
  oila: ['bola','farzand','maktab','bog‘cha','bogcha','o‘yinchoq','oyinchoq'],
  uyjoy: ['ijara','kvartira','mebel','ta‘mir','tamir','svet','elektr','gaz','suv','kommunal'],
  aloqa: ['internet','wifi','telefon','mobil','aloqa'],
  ish: ['ofis','biznes','xodim'],
  sovga: ['sovg‘a','sovga','tug‘ilgan kun','tugilgan kun'],
  kongilochar: ['kino','konsert','o‘yin','oyin','park','bilyar'],
  kutilmagan: ['jarima','shtraf','favqulodda']
};
const INCOME_KEYWORD_MAP = {
  maosh: ['maosh','ish haqi','oylik','ish haqim'],
  qarz_kirim: ['qarz qaytardi','qarzini berdi','qarzin berdi','qarz berdi','qarzimni qaytardi','qarzim qaytdi'],
  savdo: ['savdo','biznes daromad','sotdim','sotildi','buyurtma'],
  sovga_kirim: ['sovg‘a berdi','sovga berdi','hadya']
};
const INCOME_SIGNAL_WORDS = ['maosh','oylik','qarz qaytar','qarz berdi','daromad','kirim','pul tushdi','sotdim','sotildi','hadya','sovg‘a berdi','sovga berdi','ish haqi'];
function guessCategory(text, type){
  const t = text.toLowerCase();
  if(type==='income'){
    if(/qarz\S*\s*(qaytar\S*|berdi)/.test(t)) return 'qarz_kirim';
    for(const [key, words] of Object.entries(INCOME_KEYWORD_MAP)){
      if(words.some(w => t.includes(w))) return key;
    }
    return 'boshqa_kirim';
  }
  for(const [key, words] of Object.entries(KEYWORD_MAP)){
    if(words.some(w => t.includes(w))) return key;
  }
  return 'boshqa';
}
function guessType(text){
  const t = text.toLowerCase();
  if(/qarz\S*\s*(qaytar\S*|berdi)/.test(t)) return 'income';
  return INCOME_SIGNAL_WORDS.some(w=>t.includes(w)) ? 'income' : 'expense';
}
function parseSegment(raw, forcedType){
  let t = raw.trim();
  let amount = null;
  const mlnMatch = t.match(/(\d+([.,]\d+)?)\s*(mln|million)/i);
  const mingMatch = t.match(/(\d+([.,]\d+)?)\s*ming/i);
  if(mlnMatch){ amount = parseFloat(mlnMatch[1].replace(',','.')) * 1000000; }
  else if(mingMatch){ amount = parseFloat(mingMatch[1].replace(',','.')) * 1000; }
  else{
    const nums = t.match(/\d[\d\s]*\d|\d/g);
    if(nums){ amount = parseInt(nums.map(s=>s.replace(/\s/g,'')).sort((a,b)=>b.length-a.length)[0], 10); }
  }
  // clean note: drop amount phrase + filler verbs
  let note = t
    .replace(/\d+([.,]\d+)?\s*(mln|million)/gi,'')
    .replace(/\d+([.,]\d+)?\s*ming/gi,'')
    .replace(/\d[\d\s]*\d|\d/g,'')
    .replace(/\b(sarfladim|oldim|to‘ladim|toladim|xarid qildim|sotib oldim|so‘m|som|ga|uchun|berdi)\b/gi,'')
    .replace(/\s{2,}/g,' ')
    .trim();
  note = note.charAt(0).toUpperCase() + note.slice(1);
  const type = forcedType || 'expense';
  const category = guessCategory(t, type);
  return { amount: amount||0, note: note || (type==='income'?'Kirim':'Xarajat'), categoryKey: category, type };
}
function parseTranscriptMulti(text, forcedType){
  return text.split(',').map(s=>s.trim()).filter(Boolean).map(s=>parseSegment(s, forcedType)).filter(it=>it.amount>0);
}

function drawDonut(canvasId, items, centerLabel, centerValue){
  const canvas = document.getElementById(canvasId);
  if(!canvas) return;
  const ctx = canvas.getContext && canvas.getContext('2d');
  if(!ctx) return;
  const w=canvas.width, h=canvas.height;
  ctx.clearRect(0,0,w,h);
  const cx=w/2, cy=h/2, rOuter=Math.min(w,h)/2-4, rInner=rOuter*0.62;
  const total = items.reduce((s,i)=>s+i.value,0) || 1;
  let start = -Math.PI/2;
  items.forEach(it=>{
    const angle = (it.value/total) * Math.PI*2;
    if(angle<=0) return;
    ctx.beginPath(); ctx.moveTo(cx,cy);
    ctx.arc(cx,cy,rOuter,start,start+angle);
    ctx.closePath(); ctx.fillStyle = it.color; ctx.fill();
    start += angle;
  });
  ctx.beginPath(); ctx.arc(cx,cy,rInner,0,Math.PI*2); ctx.fillStyle = '#FFFFFF'; ctx.fill();
  ctx.fillStyle = '#1F2937'; ctx.textAlign='center';
  ctx.font = '700 14px Inter, sans-serif';
  ctx.fillText(fmt(centerValue), cx, cy-1);
  ctx.font = '400 9.5px Inter, sans-serif'; ctx.fillStyle='#6B7280';
  ctx.fillText(centerLabel+' so‘m', cx, cy+13);
}
function drawTrend(canvasId, dailyTotals){
  const canvas = document.getElementById(canvasId);
  if(!canvas) return;
  const ctx = canvas.getContext && canvas.getContext('2d');
  if(!ctx) return;
  const w=canvas.width, h=canvas.height;
  ctx.clearRect(0,0,w,h);
  const max = Math.max(...dailyTotals.map(d=>d.total), 1);
  const barW = w/dailyTotals.length;
  dailyTotals.forEach((d,i)=>{
    const barH = (d.total/max) * (h-18);
    ctx.fillStyle = d.total>0 ? '#1E9E64' : '#E7EAEE';
    ctx.fillRect(i*barW+1, h-barH-14, Math.max(barW-2,1), Math.max(barH,2));
  });
  ctx.strokeStyle='#E5E7EB'; ctx.beginPath(); ctx.moveTo(0,h-14); ctx.lineTo(w,h-14); ctx.stroke();
}

      ${ list.length ? list.sort((a,b)=>new Date(b.dateISO)-new Date(a.dateISO)).map(e=>{
        const cat = catByKey(e.categoryKey);
        const isIncome = e.type==='income';
        return `<div class="entry-row" data-action="edit-expense" data-id="${e.id}">
          <div class="entry-time">${e.time}</div>
          <div class="cat-icon" style="background:${cat.bg};width:34px;height:34px;font-size:15px;">${cat.icon}</div>

          <div class="entry-amt" style="color:${isIncome?'#16A34A':'inherit'};">${isIncome?'+':'−'}${fmt(e.amount)}</div>
        </div>`;
      }).join('') : '<div class="empty">Hech narsa topilmadi</div>' }
    </div>
  `;
}
function runSearch(){
  searchState.q = document.getElementById('searchQ').value.trim().toLowerCase();
  searchState.catKey = document.getElementById('searchCat').value;
  searchState.min = document.getElementById('searchMin').value;
  searchState.max = document.getElementById('searchMax').value;

  let list = [...expenses];
  const now = new Date();
  if(searchState.range === 'bugun'){ list = list.filter(e=>e.dateISO===todayISO()); }
  else if(searchState.range === '7kun'){
    const cutoff = new Date(); cutoff.setDate(cutoff.getDate()-7);
    list = list.filter(e=> new Date(e.dateISO) >= cutoff);
  } else if(searchState.range === 'oy'){
    list = expensesForMonth(now.getFullYear(), now.getMonth());
  }
  if(searchState.type !== 'all'){ list = list.filter(e=>(e.type||'expense')===searchState.type); }
  if(searchState.catKey !== 'all'){ list = list.filter(e=>e.categoryKey===searchState.catKey); }
  if(searchState.q){ list = list.filter(e=>e.note.toLowerCase().includes(searchState.q)); }
  if(searchState.min){ list = list.filter(e=>e.amount >= parseFloat(searchState.min)); }
  if(searchState.max){ list = list.filter(e=>e.amount <= parseFloat(searchState.max)); }
  searchState.results = list;
  renderSearchResults();
}
function quickTopDay(){
  const now = new Date();
  const list = expensesForMonth(now.getFullYear(), now.getMonth());
  const byDay = {}; list.forEach(e=>byDay[e.dateISO]=(byDay[e.dateISO]||0)+e.amount);
  const sorted = Object.entries(byDay).sort((a,b)=>b[1]-a[1]);
  searchState.results = sorted.length ? expensesForDate(sorted[0][0]) : [];
  renderSearchResults();
}
function quickCategoryMonth(catKey, monthOffset){
  const now = new Date();
  let m = now.getMonth()+monthOffset, y = now.getFullYear();
  if(m<0){ m=11; y--; }
  searchState.results = expensesForMonth(y,m).filter(e=>e.categoryKey===catKey);
  renderSearchResults();
}

async function exportBackup(){
  const data = JSON.stringify({expenses, categories}, null, 2);
  const filename = 'hisobchi-zaxira-'+todayISO()+'.json';

  if(isNativeApp){
    try{
      const { Filesystem } = window.Capacitor.Plugins;
      const { Share } = window.Capacitor.Plugins;
      // Write to the app's cache dir first (always writable, no permission
      // needed), then hand it to the native Share sheet so the person
      // picks exactly where it ends up (Drive, Files, Telegram, etc.)
      // and therefore always knows where it was saved.
      const written = await Filesystem.writeFile({
        path: filename,
        data: data,
        directory: 'CACHE',
        encoding: 'utf8'
      });
      await Share.share({
        title: 'Hisobchi — zaxira nusxa',
        text: 'Xarajatlar zaxira nusxasi: ' + filename,
        url: written.uri,
        dialogTitle: 'Zaxira nusxani qayerga saqlaysiz?'
      });
    }catch(e){
      alert('Zaxira nusxani ulashishda xatolik: ' + (e && e.message ? e.message : e));
    }
    return;
  }

  const blob = new Blob([data], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
document.getElementById('importFileInput').addEventListener('change', (e)=>{

/* ============================================================ SPEECH RECOGNITION
   Two code paths:
   1) Native Android app (built via Capacitor) -> uses the on-device
      @capacitor-community/speech-recognition plugin, which really works
      inside a WebView (the plain Web Speech API does NOT).
   2) Plain browser (GitHub Pages, desktop Chrome, PWA) -> uses the
      standard Web Speech API (webkitSpeechRecognition).
   ============================================================ */
// isNativeApp is defined near the top of the script.
let listening = false;

function finishListening(text){
  listening = false;
  document.getElementById('micBtn').classList.remove('listening');
  if(text){
    voiceItems = parseTranscriptMulti(text, voiceSessionType);
    if(voiceItems.length===0) voiceItems = [{amount:0, note:text, categoryKey: voiceSessionType==='income'?'boshqa_kirim':'boshqa', type: voiceSessionType}];
    document.getElementById('micStatus').textContent = 'Tayyor — quyida tekshirib saqlang';
    renderVoiceItems();
  } else {
    document.getElementById('micStatus').textContent = 'Hech narsa eshitilmadi, qayta urinib ko‘ring.';
  }
}

if(isNativeApp){
  const NativeSR = window.Capacitor.Plugins.SpeechRecognition;

  async function startNative(){
    try{
      const perm = await NativeSR.requestPermissions();
      if(perm.speechRecognition !== 'granted'){
        document.getElementById('micStatus').textContent = 'Mikrofonga ruxsat berilmadi.';
        return;
      }
      const avail = await NativeSR.available();
      if(!avail.available){
        document.getElementById('micStatus').textContent = 'Bu qurilmada ovozni tanish mavjud emas.';
        return;
      }
      document.getElementById('transcriptBox').textContent = '';
      voiceItems = []; renderVoiceItems();
      listening = true;
      document.getElementById('micBtn').classList.add('listening');
      document.getElementById('micStatus').textContent = 'Ovoz oynasi ochilmoqda... gapiring';

      // popup:true opens Google's own speech dialog, which auto-detects
      // when you stop talking and returns the finished text directly —
      // far more reliable inside a WebView than manual start/stop.
      const result = await NativeSR.start({ language: micLang, popup: true, maxResults: 1, partialResults: false });
      listening = false;
      document.getElementById('micBtn').classList.remove('listening');
      const text = (result && result.matches && result.matches.length) ? result.matches[0] : '';
      if(text) document.getElementById('transcriptBox').textContent = text;
      finishListening(text);
    }catch(e){
      listening = false;
      document.getElementById('micBtn').classList.remove('listening');
      document.getElementById('micStatus').textContent = 'Ovoz oynasi yopildi yoki hech narsa aytilmadi. Qayta urinib ko‘ring.';
    }
  }
  document.getElementById('micBtn').addEventListener('click', ()=>{
    if(!listening){ startNative(); }
  });

} else {
  const WebSR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition = null;
  if(WebSR){
    recognition = new WebSR();
    recognition.interimResults = true;
    recognition.continuous = false;
    recognition.maxAlternatives = 1;

    recognition.onstart = ()=>{
      listening = true;
      document.getElementById('micBtn').classList.add('listening');
      document.getElementById('micStatus').textContent = 'Tinglayapman... aytib bo‘lgach kuting';
    };
    recognition.onresult = (event)=>{
      let text = '';
      for(let i=0;i<event.results.length;i++){ text += event.results[i][0].transcript; }
      document.getElementById('transcriptBox').textContent = text;
    };
    recognition.onerror = (event)=>{
      listening = false;
      document.getElementById('micBtn').classList.remove('listening');
      document.getElementById('micStatus').textContent = event.error==='not-allowed'
        ? 'Mikrofonga ruxsat berilmadi.'
        : 'Til qo‘llab-quvvatlanmasa, Sozlamalardan boshqa tilni tanlang.';
    };
    recognition.onend = ()=>{
      const text = document.getElementById('transcriptBox').textContent.trim();
      finishListening(text);
    };
    document.getElementById('micBtn').addEventListener('click', ()=>{
      if(listening){ recognition.stop(); }
      else{
        document.getElementById('transcriptBox').textContent = '';
        voiceItems = []; renderVoiceItems();
        recognition.lang = micLang;
        try{ recognition.start(); }catch(e){}
      }
    });
  } else {
    document.getElementById('micStatus').textContent = 'Bu qurilmada ovozli kiritish mavjud emas. Qo‘lda qo‘shish uchun "+ Yana band qo‘shish"ni bosing.';
    document.getElementById('addVoiceItemBtn').style.display = 'block';
  }
}

/* ============================================================ SERVICE WORKER */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}

/* ============================================================ INIT */
loadAll();
renderAll();
</script>
